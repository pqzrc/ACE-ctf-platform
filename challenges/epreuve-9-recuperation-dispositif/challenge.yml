description: |
  ## Mission : Localiser le Dispositif de L.U.M.E.N.
  
  L.U.M.E.N. brouille les pistes ! Vous devez tracer le signal en **3 étapes** pour localiser le dispositif caché.
  
  **Votre mission :**
  1. Accéder à l'interface de traçage
  2. Consulter le plan pour identifier la zone du premier QR Code
  3. Vous rendre physiquement à l'emplacement indiqué
  4. Scanner le QR Code physique pour obtenir l'étape suivante
  5. Répéter jusqu'à localiser le dispositif final
  
  **Important :** Cette épreuve nécessite de vous déplacer physiquement dans les locaux !
  
  Bonne traque, Agent !

