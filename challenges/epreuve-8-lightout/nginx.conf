server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Block access to no_blur.jpg specifically (403 Forbidden)
    location = /no_blur.jpg {
        return 403;
    }

    # Allow blur.jpg
    location = /blur.jpg {
        # Allowed
    }

    # Default location
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
