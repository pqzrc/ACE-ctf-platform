server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Bloquer l'accès direct à l'image de solution
    location ~* no_blur\.jpg$ {
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Access-Control-Allow-Origin *;
    }
}
