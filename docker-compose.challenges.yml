# Docker Compose pour les Challenges ACE 2025
# Ce fichier définit tous les conteneurs des épreuves

name: ace-challenges

services:
  # =====================================================
  # REVERSE PROXY - Traefik pour le routage des challenges
  # =====================================================
  traefik:
    image: traefik:v3.0
    restart: always
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - "8081:80"      # Port principal des challenges (via Apache reverse proxy)
      - "8082:8080"    # Dashboard Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - challenges-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # =====================================================
  # ÉPREUVE 1 - Identifier le Phishing
  # =====================================================
  epreuve1-phishing:
    build:
      context: ./challenges/epreuve-1-phishing
      dockerfile: Dockerfile
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.epreuve1.rule=Host(`hamecon-phishing.challenges.vizyondijital.fr`) || Host(`hamecon-phishing.localhost`)
      - traefik.http.routers.epreuve1.entrypoints=web
      - traefik.http.services.epreuve1.loadbalancer.server.port=80
    networks:
      - challenges-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # =====================================================
  # ÉPREUVE 2 - Mot de Passe Sécurisé
