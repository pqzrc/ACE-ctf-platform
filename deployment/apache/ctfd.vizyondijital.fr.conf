<VirtualHost *:80>
    ServerName ctfd.vizyondijital.fr
    ServerAdmin admin@vizyondijital.fr

    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/ctfd-error.log
    CustomLog ${APACHE_LOG_DIR}/ctfd-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName ctfd.vizyondijital.fr
    ServerAdmin admin@vizyondijital.fr

    # SSL Configuration (Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/ctfd.vizyondijital.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ctfd.vizyondijital.fr/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Proxy vers CTFd (port 8000)
    ProxyPreserveHost On
    ProxyPass / http://localhost:8000/
    ProxyPassReverse / http://localhost:8000/

    # WebSocket support pour CTFd
    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://localhost:8000/$1" [P,L]

    # Headers de sécurité
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Upload file size limit (pour CTFd uploads)
    LimitRequestBody 104857600

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/ctfd-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/ctfd-ssl-access.log combined
</VirtualHost>
