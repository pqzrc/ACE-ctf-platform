<VirtualHost *:80>
    ServerName challenges.vizyondijital.fr
    ServerAlias *.challenges.vizyondijital.fr
    ServerAdmin admin@vizyondijital.fr

    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/challenges-error.log
    CustomLog ${APACHE_LOG_DIR}/challenges-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName challenges.vizyondijital.fr
    ServerAlias *.challenges.vizyondijital.fr
    ServerAdmin admin@vizyondijital.fr

    # SSL Configuration (Let's Encrypt - Wildcard)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/challenges.vizyondijital.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/challenges.vizyondijital.fr/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Proxy vers Traefik (port 8081)
    # Traefik gère le routing vers les différents challenges
    ProxyPreserveHost On
    ProxyPass / http://localhost:8081/
    ProxyPassReverse / http://localhost:8081/

    # WebSocket support
    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://localhost:8081/$1" [P,L]

    # Headers de sécurité
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/challenges-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/challenges-ssl-access.log combined
</VirtualHost>
