services:
  # CTFd Application
  ctfd:
    build: .
    user: root
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Variables calculées à partir du .env
      - DATABASE_URL=mysql+pymysql://ctfd:${MYSQL_PASSWORD}@db/ctfd
      - REDIS_URL=redis://cache:6379

    volumes:
      # Plugins
      - ./plugins/registration_sync:/opt/CTFd/CTFd/plugins/registration_sync
      - ./plugins/score_sync:/opt/CTFd/CTFd/plugins/score_sync
      - ./plugins/auth_sync:/opt/CTFd/CTFd/plugins/auth_sync
      - ./plugins/room_display:/opt/CTFd/CTFd/plugins/room_display
      - ./plugins/disable_team_editing:/opt/CTFd/CTFd/plugins/disable_team_editing
      - ./plugins/homepage_redirect:/opt/CTFd/CTFd/plugins/homepage_redirect
      - ./plugins/disable_direct_auth:/opt/CTFd/CTFd/plugins/disable_direct_auth
      - ./plugins/team_requirement_message:/opt/CTFd/CTFd/plugins/team_requirement_message
      - ./plugins/disable_user_settings:/opt/CTFd/CTFd/plugins/disable_user_settings

      # Themes (optionnel)
      # NOTE: Le montage du volume themes écrase le thème core de CTFd
      # Pour utiliser un thème personnalisé, copiez-le dans l'image ou utilisez un montage nommé
      # - ./themes:/opt/CTFd/CTFd/themes

      # Uploads persistants
      - ctfd_uploads:/var/uploads

      # Logs
      - ctfd_logs:/var/log/CTFd

    depends_on:
      - db
      - cache

    networks:
      - ctfd-internal
      - ace-network # Réseau partagé avec le site d'inscription

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # MariaDB Database
  db:
    image: mariadb:10.11
    restart: always
    env_file:
      - .env
    environment:
      - MYSQL_USER=ctfd
      - MYSQL_DATABASE=ctfd
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ctfd_db:/var/lib/mysql
    networks:
      - ctfd-internal
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --wait_timeout=28800
      - --log-warnings=0

  # Redis Cache
  cache:
    image: redis:7-alpine
    restart: always
    volumes:
      - ctfd_redis:/data
    networks:
      - ctfd-internal

  # Traefik (Reverse Proxy pour les challenges)
  traefik:
    image: traefik:v3.2
    restart: always
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=ctfd-challenges"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "8081:80" # Changé pour éviter conflit avec nginx
      - "8443:443" # Changé pour éviter conflit
      - "8082:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ctfd-challenges
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.ctf.local`)"
      - "traefik.http.routers.traefik.service=api@internal"

  # ===== 5 Test Challenges =====

  challenge_test1:
    build: ./challenges/test1-static/deploy
    restart: always
    networks:
      - ctfd-challenges
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.test1.rule=Host(`test1.challenges.vizyondijital.fr`)"
      - "traefik.http.services.test1.loadbalancer.server.port=80"

  challenge_test2:
    build: ./challenges/test2-source/deploy
    restart: always
    networks:
      - ctfd-challenges
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.test2.rule=Host(`test2.challenges.vizyondijital.fr`)"
      - "traefik.http.services.test2.loadbalancer.server.port=80"

  challenge_test3:
    build: ./challenges/test3-file/deploy
    restart: always
    networks:
      - ctfd-challenges
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.test3.rule=Host(`test3.challenges.vizyondijital.fr`)"
      - "traefik.http.services.test3.loadbalancer.server.port=80"

  challenge_test4:
    build: ./challenges/test4-form/deploy
    restart: always
    networks:
      - ctfd-challenges
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.test4.rule=Host(`test4.challenges.vizyondijital.fr`)"
      - "traefik.http.services.test4.loadbalancer.server.port=80"

  challenge_test5:
    build: ./challenges/test5-calc/deploy
    restart: always
    networks:
      - ctfd-challenges
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.test5.rule=Host(`test5.challenges.vizyondijital.fr`)"
      - "traefik.http.services.test5.loadbalancer.server.port=80"

# Networks
networks:
  ctfd-internal:
    driver: bridge
    internal: true # Pas d'accès internet pour la DB/Redis

  ctfd-challenges:
    driver: bridge

  ace-network:
    name: ace-website_ace-network
    external: true # Réseau créé par le site d'inscription ACE
    # Ce réseau permet à CTFd de communiquer avec backend:5000

    # Volumes
volumes:
  ctfd_db:
    driver: local
  ctfd_redis:
    driver: local
  ctfd_uploads:
    driver: local
  ctfd_logs:
    driver: local
