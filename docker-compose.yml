name: ace-ctf

services:
  ctfd:
    build: .
    user: root
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql+pymysql://ctfd:${MYSQL_PASSWORD}@db/ctfd
      - REDIS_URL=redis://cache:6379
      - FRONTEND_URL=${FRONTEND_URL}
      - REGISTRATION_SITE_URL=${REGISTRATION_SITE_URL}
    volumes:
      - ./plugins/registration_sync:/opt/CTFd/CTFd/plugins/registration_sync
      - ./plugins/score_sync:/opt/CTFd/CTFd/plugins/score_sync
      - ./plugins/auth_sync:/opt/CTFd/CTFd/plugins/auth_sync
      - ./plugins/room_display:/opt/CTFd/CTFd/plugins/room_display
      - ./plugins/disable_team_editing:/opt/CTFd/CTFd/plugins/disable_team_editing
      - ./plugins/homepage_redirect:/opt/CTFd/CTFd/plugins/homepage_redirect
      - ./plugins/disable_direct_auth:/opt/CTFd/CTFd/plugins/disable_direct_auth
      - ./plugins/team_requirement_message:/opt/CTFd/CTFd/plugins/team_requirement_message
      - ./plugins/disable_user_settings:/opt/CTFd/CTFd/plugins/disable_user_settings
      - ./plugins/empty_challenges_message:/opt/CTFd/CTFd/plugins/empty_challenges_message
      - ctfd_uploads:/var/uploads
      - ctfd_logs:/var/log/CTFd
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - ctfd-internal
      - ace-website_ace-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mariadb:10.11
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=ctfd
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=ctfd
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ctfd_db:/var/lib/mysql
    networks:
      - ctfd-internal
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --wait_timeout=28800
      - --log-warnings=0
      - --max-connections=200
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cache:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ctfd_redis:/data
    networks:
      - ctfd-internal
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

networks:
  ctfd-internal:
    driver: bridge
  ace-website_ace-network:
    external: true

volumes:
  ctfd_db:
  ctfd_redis:
  ctfd_uploads:
  ctfd_logs: